name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    # The shared workflow can only have what its caller grants, and this
    # repo's default token is read-only.
    permissions:
      contents: read
      deployments: write
    uses: lonniev/dpyc-community/.github/workflows/deploy-frontend.yml@main
    with:
      pages-project: chartremotely-app
    secrets: inherit
